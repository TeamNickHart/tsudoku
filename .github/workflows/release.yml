name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: all quality checks must pass before any release activity
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm benchmark

  # Version PR or publish — only runs after quality gate passes
  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    env:
      # Hoisted to env so steps can branch on whether publishing is configured.
      # `secrets` is not available in job-level `if:`, and env is the portable
      # way to test a secret's presence from a step.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Only meaningful once NPM_TOKEN is configured. Until then this job still
      # runs so the changesets action can open/update the version PR; publishing
      # is what needs auth, and `changeset publish` is a no-op with no pending
      # changesets. Skipping keeps main green pre-first-release.
      - name: Validate npm auth
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm whoami --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Warn when npm publishing is not configured
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::notice::NPM_TOKEN is not set — skipping npm auth validation."
          echo "::notice::Version PRs still work; nothing will be published to npm."

      # `publish` is set only when NPM_TOKEN is configured. Without it the action
      # still opens/updates the version PR, but makes no publish attempt.
      #
      # This matters: the action falls back to npm OIDC trusted publishing when
      # no NPM_TOKEN is present (`id-token: write` is granted above), so leaving
      # `publish` unconditionally set means every push to main tries to publish
      # to npm. Publishing is irreversible and public — it should happen only
      # when deliberately configured.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: ${{ env.HAS_NPM_TOKEN == 'true' && 'pnpm changeset publish' || '' }}
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub Releases
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Published packages:"
          echo '${{ steps.changesets.outputs.publishedPackages }}'
