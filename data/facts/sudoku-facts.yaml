# Sudoku Facts & Trivia
# Fun facts for display in the app or docs. Not authoritative — always link
# to primary sources for anything important.
#
# Schema: id, category, claim, source, source_url, tags
# verified: true = sourced and spot-checked; false = plausible but unconfirmed
# Categories: combinatorics, puzzle-theory, history, variants, records, culture

facts:
  # ── Combinatorics ─────────────────────────────────────────────────────────────

  - id: grid-count-total
    category: combinatorics
    claim: >
      There are exactly 6,670,903,752,021,072,936,960 possible completed
      9×9 Sudoku grids — roughly 6.67 × 10²¹.
    source: 'Felgenhauer & Jarvis (2006), Mathematics of Sudoku I'
    source_url: 'http://www.afjarvis.org.uk/sudoku/sudoku.pdf'
    verified: true
    tags: [combinatorics, count]

  - id: grid-count-essentially-different
    category: combinatorics
    claim: >
      When rotations, reflections, and digit relabelings are accounted for,
      there are only 5,472,730,538 essentially different completed grids.
    source: 'Russell & Jarvis (2006), Mathematics of Sudoku II'
    source_url: 'http://www.afjarvis.org.uk/sudoku/sudoku2.pdf'
    verified: true
    tags: [combinatorics, symmetry]

  # ── Puzzle Theory ─────────────────────────────────────────────────────────────

  - id: minimum-clues
    category: puzzle-theory
    claim: >
      A valid 9×9 Sudoku with a unique solution requires at least 17 given
      clues. No 16-clue puzzle with a unique solution exists.
    source: 'McGuire, Tugemann & Civario (2012), There is no 16-Clue Sudoku'
    source_url: 'https://arxiv.org/abs/1201.0749'
    verified: true
    tags: [clues, minimum, proof]

  - id: uniqueness-assumption
    category: puzzle-theory
    claim: >
      Several solving techniques — including Unique Rectangle and BUG —
      only work if you assume the puzzle has exactly one solution.
    source: 'General Sudoku solving literature; SudokuWiki'
    source_url: 'https://www.sudokuwiki.org'
    verified: true
    tags: [uniqueness, techniques, solving]

  - id: not-about-math
    category: puzzle-theory
    claim: >
      Sudoku requires no arithmetic. The digits 1–9 are purely symbolic and
      could be replaced with any nine distinct symbols without changing the puzzle.
    source: 'General Sudoku convention'
    source_url: null
    verified: true
    tags: [symbols, logic, math]

  # ── History ───────────────────────────────────────────────────────────────────

  - id: origin-number-place
    category: history
    claim: >
      The modern Sudoku puzzle was invented by Howard Garns, an American
      architect, and first published in 1979 as "Number Place" by Dell Magazines.
    source: 'Will Shortz, The New York Times'
    source_url: 'https://www.nytimes.com/2007/03/11/crosswords/11squarenew.html'
    verified: true
    tags: [history, origin, garns, dell]

  - id: garns-posthumous
    category: history
    claim: >
      Howard Garns died in 1989 — more than fifteen years before the global
      Sudoku craze of 2004–2005. He never saw his puzzle become famous.
    source: 'Will Shortz, The New York Times'
    source_url: 'https://www.nytimes.com/2007/03/11/crosswords/11squarenew.html'
    verified: true
    tags: [history, garns]

  - id: japan-popularization
    category: history
    claim: >
      Nikoli introduced the puzzle to Japan in 1984 under the name 数独
      (Sūdoku), a contraction of 数字は独身に限る — "digits must be single."
    source: 'Nikoli Co., Ltd.'
    source_url: 'https://www.nikoli.co.jp'
    verified: true
    tags: [history, japan, nikoli, name]

  - id: global-craze-2004
    category: history
    claim: >
      The global Sudoku craze began in 2004 when Wayne Gould convinced
      The Times of London to publish the puzzle.
    source: 'The Times (UK); various press sources'
    source_url: null
    verified: true
    tags: [history, craze, 2004, gould]

  - id: latin-square-connection
    category: history
    claim: >
      Sudoku is a constrained form of a Latin square — a concept studied by
      Leonhard Euler in the 18th century.
    source: 'General combinatorics literature'
    source_url: null
    verified: true
    tags: [history, math, latin-square, euler]

  # ── Records ───────────────────────────────────────────────────────────────────

  - id: world-sudoku-championship
    category: records
    claim: >
      The World Sudoku Championship has been held annually since 2006,
      organized by the World Puzzle Federation.
    source: 'World Puzzle Federation'
    source_url: 'https://www.worldpuzzle.org'
    verified: true
    tags: [records, competition, championship]

  - id: competitive-solve-times
    category: records
    claim: >
      Top competitive solvers can complete championship-level puzzles in
      1–2 minutes.
    source: 'World Sudoku Championship records'
    source_url: 'https://www.worldpuzzle.org'
    verified: true
    tags: [records, competition, speed]

  # ── Variants ──────────────────────────────────────────────────────────────────

  - id: variant-killer
    category: variants
    claim: >
      Killer Sudoku replaces given digits with "cages" — groups of cells
      whose digits must sum to a given total, with no repeats within a cage.
    source: 'Nikoli; The Times (UK)'
    source_url: null
    verified: true
    tags: [variants, killer, cages]

  - id: variant-diagonals
    category: variants
    claim: >
      Diagonal Sudoku adds the constraint that both main diagonals must also
      contain each digit 1–9 exactly once.
    source: 'General puzzle literature'
    source_url: null
    verified: true
    tags: [variants, diagonals]

  - id: variant-16x16
    category: variants
    claim: >
      The 16×16 variant uses a 4×4 arrangement of 4×4 boxes, typically
      with digits 1–9 plus letters A–G.
    source: 'General puzzle literature'
    source_url: null
    verified: true
    tags: [variants, 16x16]
